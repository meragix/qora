name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
      # The changelog page reads these files in place (docs/content.config.ts).
      - "packages/*/CHANGELOG.md"
      - "packages/devtools/*/CHANGELOG.md"
  # Build only, no deploy: a page that fails to prerender, such as the
  # changelog page on a malformed CHANGELOG.md, fails the PR before the merge.
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
      - "packages/*/CHANGELOG.md"
      - "packages/devtools/*/CHANGELOG.md"

# The build job, which also runs on PRs, only reads; deploy alone writes to Pages.
permissions:
  contents: read

concurrency:
  # Deploys queue one after another; a PR build only replaces its own previous run.
  group: ${{ github.event_name == 'push' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build website
        working-directory: ./docs
        env:
          # Absolute URLs in sitemap.xml, canonical tags and og:image.
          NUXT_SITE_URL: https://qora.meragix.dev
        run: npm run build
      
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.output/public

  deploy:
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
