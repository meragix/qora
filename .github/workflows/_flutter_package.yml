name: Flutter Package CI

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: "Path to the package (e.g. packages/flutter)"
      test-command:
        required: false
        type: string
        default: "flutter test --coverage"
        description: "Test command (override for web-only packages)"

jobs:
  ci:
    name: "${{ inputs.package }}"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos 7.4.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Format
        working-directory: ${{ inputs.package }}
        run: dart format .

      - name: Analyze
        working-directory: ${{ inputs.package }}
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: ${{ inputs.package }}
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: inputs.test-command == 'flutter test --coverage'
        uses: codecov/codecov-action@v4
        with:
          directory: ${{ inputs.package }}/coverage
          flags: ${{ inputs.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
